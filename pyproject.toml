[tool.poetry]
name = "example-polars"
version = "0.1.0"
description = ""
authors = ["Denis Germano <denis.germano@nearform.com>"]
readme = "README.md"
package-mode = false
# poetry.lock is lock-version 2.1; Poetry 1.x reads it only with a
# compatibility warning. Poetry 2.x is the supported floor.
requires-poetry = ">=2.0"

[tool.poetry.dependencies]
python = "^3.12"
polars = "^1.7.1"
pandas = "^2.2.3"


[tool.poetry.group.dev.dependencies]
black = "^26.3.1"
isort = "^5.13.2"
autoflake = "^2.3.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
